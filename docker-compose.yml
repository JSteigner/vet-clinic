# Optional: use this if you don't have Postgres installed locally.
# Listens on 5432 by default. If something else is already on 5432,
# `export DB_PORT=5433` and both Docker Compose and Mix will use it.
services:
  db:
    image: postgres:18-alpine
    container_name: vet-clinic-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - vet_clinic_pg18data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  vet_clinic_pg18data:
